<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourism Recommendation System - TripAdvisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🌍 Tourism Recommendation System</h1>
        
        <div class="card">
            <h2>Find Your Perfect Attractions</h2>
            
            <div class="form-group">
                <label>📍 City (Optional):</label>
                <select id="city">
                    <option value="any">Any City</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>🌐 Country (Optional):</label>
                <select id="country">
                    <option value="any">Any Country</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>⭐ Minimum Rating:</label>
                <select id="minRating">
                    <option value="0">Any Rating</option>
                    <option value="3.0">3.0+ Stars</option>
                    <option value="3.5">3.5+ Stars</option>
                    <option value="4.0" selected>4.0+ Stars</option>
                    <option value="4.5">4.5+ Stars</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>🎯 Interest Categories (select all that apply):</label>
                <div class="checkbox-group" id="categoriesGroup">
                    <div class="loading">Loading categories...</div>
                </div>
            </div>
            
            <div class="form-group">
                <label>📊 Number of Recommendations:</label>
                <input type="number" id="limit" value="10" min="1" max="20" placeholder="1-20">
            </div>
            
            <button id="recommendBtn" onclick="getRecommendations()">Get Recommendations</button>
            <button type="button" onclick="clearAllFilters()" style="background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); margin-top: 10px;">
                🔄 Clear All Filters
            </button>
        </div>
        
        <div id="recommendations" class="results"></div>
        
        <div id="optimizeSection" class="card">
            <h2>Optimize Your Itinerary</h2>
            <p style="margin-bottom: 15px; color: #666;">
                Selected <span id="selectedCount">0</span> attraction(s)
            </p>
            <button type="button" onclick="clearSelections()" style="background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); padding: 10px 20px; font-size: 14px; margin-bottom: 15px;">
                ✕ Clear Selections
            </button>
            <div class="form-group">
                <label>📅 Total Days for Trip:</label>
                <input type="number" id="days" placeholder="e.g., 5" min="1" required>
            </div>
            <button onclick="optimizeItinerary()">Optimize Itinerary</button>
            <div id="itinerary"></div>
        </div>
    </div>
    
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
